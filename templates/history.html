{% extends "base.html" %}

{% block content %}

<section class="page-title">
    <h2>History</h2>
    <p>Previous monitoring records from connected sources.</p>
</section>

<section class="content-card">
    <h3>Filters</h3>

    <form id="history-filter-form" class="filters-grid">
        <div class="filter-group">
            <label for="source-filter">Source</label>
            <select id="source-filter" name="source">
                <option value="all">All</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="start-date-filter">Start Date</label>
            <input type="date" id="start-date-filter" name="start_date">
        </div>

        <div class="filter-group">
            <label for="end-date-filter">End Date</label>
            <input type="date" id="end-date-filter" name="end_date">
        </div>

        <div class="filter-group">
            <label for="status-filter">Status</label>
            <select id="status-filter" name="status">
                <option value="all">All</option>
                <option value="Online">Online</option>
                <option value="Warning">Warning</option>
                <option value="Offline">Offline</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="metric-filter">Metric</label>
            <select id="metric-filter" name="metric">
                <option value="all">All</option>
                <option value="cpu_usage">CPU</option>
                <option value="memory_usage">Memory</option>
                <option value="disk_usage">Disk</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="operator-filter">Condition</label>
            <select id="operator-filter" name="operator">
                <option value="none">No number filter</option>
                <option value="greater">Greater than</option>
                <option value="less">Less than</option>
                <option value="equal">Equal to</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="number-filter">Number</label>
            <input type="number" id="number-filter" name="number" placeholder="Example: 80">
        </div>

        <div class="filter-actions">
            <button type="submit">Apply Filter</button>
            <button type="button" id="reset-filter-button">Reset</button>
        </div>
    </form>
</section>

<section class="content-card">
    <div class="section-header">
        <h3>Historical Data</h3>
        <span id="history-count">0 records</span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Source Name</th>
                    <th>CPU</th>
                    <th>Memory</th>
                    <th>Disk</th>
                    <th>Status</th>
                    <th>Warning Message</th>
                </tr>
            </thead>
            <tbody id="history-table-body">
                <tr>
                    <td colspan="7">Loading historical data...</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
